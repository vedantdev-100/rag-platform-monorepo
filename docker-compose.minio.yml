# Overlay: use together with docker-compose.yml. Existing DB/Redis stay external.
x-source-storage: &source-storage
  STORAGE_BACKEND: ${RAG_STORAGE_BACKEND:-minio}
  MINIO_ENDPOINT_URL: http://minio:9000
  MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.compose}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.compose}
  MINIO_REGION: us-east-1

services:
  minio:
    build:
      context: ./infra/minio
      dockerfile: Dockerfile
    image: rag-platform/minio:RELEASE.2025-10-15T17-29-55Z
    init: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.compose}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.compose}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 20s

  minio-init:
    image: rag-platform/rag-service:local
    environment: *source-storage
    command: ["python", "-m", "app.cli.init_minio"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  rag-service:
    environment: *source-storage
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
