[project]
name = "rag-persistence"
version = "0.1.0"
description = "Shared RAG database models and repositories"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "pgvector==0.3.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_persistence*"]
