[project]
name = "rag-service"
version = "0.1.0"
description = "RAG microservice: multimodal ingestion, hybrid retrieval, generation"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "pgvector==0.3.6",

    "aiofiles==24.1.0",
    "httpx==0.27.2",
    "slowapi==0.1.9",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "platform-auth[redis]",
    "python-multipart>=0.0.32",
    "rag-contracts",
    "rag-persistence",
    "boto3==1.40.20",
]

[project.optional-dependencies]
generation = ["langgraph==1.2.12", "langchain-core==1.6.6"]
worker = [
    "docling-core[chunking]==2.74.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "huggingface-hub==0.36.2",
]
local-models = [
    "docling==2.87.0",
    "sentence-transformers==3.3.1",
    "docling-core[chunking]==2.74.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "huggingface-hub==0.36.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.3", "pytest-asyncio==0.24.0", "ruff==0.7.0", "mypy==1.13.0",
      "python-docx==1.2.0", "pillow==12.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
resolution = "highest"
prerelease = "disallow"
exclude-newer = "7 days"
default-groups = ["dev"]

[tool.uv.sources]
platform-auth = { git = "https://github.com/vedantdev-100/platform-auth.git", tag = "v1.0.0" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
rag-contracts = { path = "../../packages/rag-contracts", editable = true }
rag-persistence = { path = "../../packages/rag-persistence", editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
